<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    color: #fff;
  }
  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    border: 3px solid rgba(255,255,255,0.2);
  }
  .name-input {
    display: block;
    width: 100%;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    background: transparent;
    border: none;
    border-bottom: 2px dashed rgba(255,255,255,0.2);
    color: #fff;
    padding: 6px 4px;
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-input::placeholder { color: rgba(255,255,255,0.35); }
  .name-input:focus { border-bottom-color: #667eea; }
  .bio {
    text-align: center;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 24px;
  }
  .files-section { margin-bottom: 20px; }
  .files-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .drop-zone {
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #667eea;
    background: rgba(102,126,234,0.1);
    color: #a5b4fc;
  }
  .drop-zone input { display: none; }
  .drop-zone .icon { font-size: 28px; display: block; margin-bottom: 6px; }
  .file-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.07);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    gap: 10px;
  }
  .file-item .fname {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .file-item .fsize {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    flex-shrink: 0;
  }
  .file-item .remove {
    background: none;
    border: none;
    color: #f87171;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .file-item .remove:hover { transform: scale(1.2); }
  .tiktok-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    background: linear-gradient(135deg, #25F4EE, #000, #FE2C55);
    color: #fff;
    padding: 14px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 24px rgba(254,44,85,0.3);
  }
  .tiktok-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(254,44,85,0.45);
  }
  .tiktok-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .empty {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 8px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="avatar">👤</div>

  <!-- Ô nhập tên -->
  <input type="text" class="name-input" id="nameInput" placeholder="Nam Mod" maxlength="40">

  <div class="bio">Tiểu sử ngắn — không số điện thoại, không email, không địa điểm</div>

  <div class="files-section">
    <div class="files-label">📁 Tệp của tôi</div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" multiple>
      <span class="icon">⬆️</span>
      Kéo thả hoặc nhấn để chọn tệp
    </div>
    <div class="file-list" id="fileList">
      <div class="empty" id="emptyMsg">Chưa có tệp nào</div>
    </div>
  </div>

  <a class="tiktok-btn" href="https://www.tiktok.com/@c.ngc345" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
    Theo dõi trên TikTok
  </a>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const emptyMsg = document.getElementById('emptyMsg');
const nameInput = document.getElementById('nameInput');

// Lưu tên vào localStorage
nameInput.value = localStorage.getItem('profileName') || '';
nameInput.addEventListener('input', () => {
  localStorage.setItem('profileName', nameInput.value);
});

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

function addFiles(files) {
  if (emptyMsg) emptyMsg.style.display = 'none';
  Array.from(files).forEach(file => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `
      <span class="fname" title="${file.name}">📄 ${file.name}</span>
      <span class="fsize">${formatSize(file.size)}</span>
      <button class="remove" title="Xóa">✕</button>
    `;
    item.querySelector('.remove').onclick = () => {
      item.remove();
      if (!fileList.querySelector('.file-item')) {
        emptyMsg.style.display = 'block';
      }
    };
    fileList.appendChild(item);
  });
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => addFiles(e.target.files));

['dragenter','dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); })
);
['dragleave','drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); })
);
dropZone.addEventListener('drop', e => addFiles(e.dataTransfer.files));
</script>

</body>
</html>
